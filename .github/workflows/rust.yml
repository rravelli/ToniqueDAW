name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Builds the week's caches (see below).
  schedule:
    - cron: "0 3 * * 1"

# A new push to the same branch/PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless on fresh runners and bloat the cache.
  CARGO_INCREMENTAL: 0

# Jobs run in parallel; each one caches its own build, under a new key
# each week: on a partial match (Cargo.toml or Cargo.lock changed),
# rust-cache first deletes every artifact older than a week, so an older
# cache is wiped and the build starts from nothing. Monday's scheduled
# run builds the week's caches.
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.week.outputs.week }}
      # Also enforces the workspace lints (no `unwrap()` outside tests).
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          # Own key: the job id alone matched the old `cargo test` cache,
          # and an exact match is never re-saved, so the coverage build
          # (target/llvm-cov-target) was never cached.
          key: llvm-cov-${{ steps.week.outputs.week }}
          cache-on-failure: true
          # Only master writes the cache; PRs restore it without evicting it.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Prebuilt binary: seconds instead of compiling cargo-llvm-cov every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Runs the test suite and collects coverage in a single build.
      - run: cargo llvm-cov --workspace --all-features --codecov --output-path codecov.json
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          fail_ci_if_error: true

  # Linux is covered by the jobs above; catch code that doesn't compile on
  # the other platforms before a release does.
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.week.outputs.week }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo check --workspace --all-targets --locked
