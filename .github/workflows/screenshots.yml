name: Screenshots

# Renders the README's images headless. On a pull request, compares them
# with master's and keeps both, for the Publish screenshots workflow to
# show in a comment; on master, keeps them as the next pull requests'
# "before".
#
# This runs the pull request's code, so it gets no write access and no
# secrets: publishing happens in publish-screenshots.yml, from master.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info: of no use to render, it makes the build (and the
  # cache) several times bigger and linking slower.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  render:
    name: Render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Runners have no GPU: lavapipe renders with Vulkan on the CPU.
      - name: Install system dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev pkg-config mesa-vulkan-drivers imagemagick
      # Saved from pull requests too: no other job builds this test
      # binary, so without its own cache every push would build from
      # nothing. A pull request starts from master's.
      - uses: Swatinem/rust-cache@v2
      # Into out/ alone: images/ holds the logos too.
      - name: Render
        env:
          WGPU_BACKEND: vulkan
          TONIQUE_IMAGES_DIR: ${{ github.workspace }}/out
        run: >
          cargo test --bin tonique_daw -- --ignored --nocapture
          ui::app::tests::readme::readme_images
      - name: Compare with master
        if: github.event_name == 'pull_request'
        run: .github/scripts/compare-screenshots.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: out/
          if-no-files-found: error
          retention-days: 7
