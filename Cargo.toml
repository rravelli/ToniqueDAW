[package]
name = "tonique_daw"
version = "0.3.0"
authors = ["Rémi Ravelli <remi.ravelli@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
members = ["crates/tonique-core", "crates/tonique-engine"]
# `cargo test` and `cargo clippy` at the root cover the core too.
default-members = [".", "crates/tonique-core"]

# `expect("why it can't fail")` documents an invariant; a bare `unwrap()`
# outside tests is usually a crash waiting for the wrong input.
[workspace.lints.clippy]
unwrap_used = "deny"

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tonique-core = { path = "crates/tonique-core" }
tonique-engine = { path = "crates/tonique-engine", features = [
    "device",
    "signalsmith",
] }
eframe = "0.36"
cpal = "0.18"
rfd = "0.15.4"
egui-phosphor = { version = "0.14.0", features = ["fill"] }
egui = "0.36"
rand = "0.9.2"
sysinfo = "0.36.1"
rustfft = "6.4.0"
toml = "1"
egui_extras = { version = "0.36", features = ["svg"] }

# Taskbar progress. Already in the build through rfd and accesskit; this only
# adds the blocking API.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = [
    "async-io",
    "blocking-api",
] }

# Profiles only take effect at the workspace root.
# Debug info isn't shipped with releases.
[profile.release]
strip = true

[profile.test]
opt-level = 1

# Decoding and DSP are unusably slow unoptimised (a song takes tens of
# seconds to decode). Optimise dependencies and the engine in dev builds;
# they rarely change, so incremental rebuilds stay fast.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.tonique-engine]
opt-level = 3

# Stretching runs on the audio thread too: as fast as in release.
[profile.dev.package.signalsmith-stretch]
opt-level = 3

[dev-dependencies]
# Its tests' configuration and no audio devices, for the app's tests too.
tonique-core = { path = "crates/tonique-core", features = ["test-support"] }
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1.0.141"
