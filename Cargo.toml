# Tonique: the engine, the core (no UI toolkit) and the app drawing it with
# egui. The release is the egui app, `tonique_daw`.
[workspace]
members = [
    "crates/tonique-core",
    "crates/tonique-egui",
    "crates/tonique-engine",
]
# `cargo run`, `cargo build` and `cargo test` at the root: the app and the
# core. CI passes `--workspace` for the rest.
default-members = ["crates/tonique-egui", "crates/tonique-core"]
# A virtual workspace doesn't take it from an edition: without it, the
# dev-only `test-support` feature of the core would reach release builds.
resolver = "3"

[workspace.package]
authors = ["Rémi Ravelli <remi.ravelli@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tonique-core = { path = "crates/tonique-core" }
tonique-engine = { path = "crates/tonique-engine", features = [
    "device",
    "signalsmith",
] }

# `expect("why it can't fail")` documents an invariant; a bare `unwrap()`
# outside tests is usually a crash waiting for the wrong input.
[workspace.lints.clippy]
unwrap_used = "deny"

# Profiles only take effect at the workspace root.
# Debug info isn't shipped with releases.
[profile.release]
strip = true

[profile.test]
opt-level = 1

# Decoding and DSP are unusably slow unoptimised (a song takes tens of
# seconds to decode). Optimise dependencies and the engine in dev builds;
# they rarely change, so incremental rebuilds stay fast.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.tonique-engine]
opt-level = 3

# Stretching runs on the audio thread too: as fast as in release.
[profile.dev.package.signalsmith-stretch]
opt-level = 3
