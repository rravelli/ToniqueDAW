[package]
name = "tonique_daw"
version = "0.1.0"
authors = ["Rémi Ravelli <remi.ravelli@gmail.com>"]
edition = "2024"
publish = false

[workspace]
members = ["crates/tonique-engine"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tonique-engine = { path = "crates/tonique-engine", features = ["device"] }
eframe = "0.36"
rtrb = "0.3"
cpal = "0.18"
creek = { version = "1.2.2", features = ["decode-mp3"] }
rfd = "0.15.4"
symphonia = "0.5.4"
uuid = { version = "1.17.0", features = ["v4"] }
egui-phosphor = { version = "0.14.0", features = ["fill"] }
egui = "0.36"
once_cell = "1.21.3"
dashmap = "6.1.0"
rand = "0.9.2"
sysinfo = "0.36.1"
directories = "6.0.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
rustfft = "6.4.0"
midir = "0.11"
midly = "0.5.3"

# Profiles only take effect at the workspace root.
[profile.test]
opt-level = 1

# Decoding and DSP are unusably slow unoptimised (a song takes tens of
# seconds to decode). Optimise dependencies and the engine in dev builds;
# they rarely change, so incremental rebuilds stay fast.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.tonique-engine]
opt-level = 3
