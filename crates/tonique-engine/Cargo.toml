[package]
name = "tonique-engine"
description = "A graph-based, real-time safe audio engine for DAWs"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

# Only the criterion targets: libtest rejects criterion's flags.
[lib]
bench = false

[features]
default = []
# Real audio device output through cpal.
device = ["dep:cpal"]

# Keep this crate free of UI dependencies: it must stay usable (and
# publishable) on its own. UI code lives in the DAW crate at the repo root.
[dependencies]
crossbeam-queue = "0.3"
hound = "3.5"
libc = "0.2"
rtrb = "0.4"
rustfft = "6.4"
cpal = { version = "0.18", optional = true }

[[example]]
name = "play"
required-features = ["device"]

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "html_reports"] }

# `cargo bench -p tonique-engine`; compare branches with
# `-- --save-baseline master` then `-- --baseline master`.
[[bench]]
name = "engine"
harness = false

[[bench]]
name = "dsp"
harness = false
